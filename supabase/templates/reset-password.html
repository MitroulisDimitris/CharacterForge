<!-- Supabase → Authentication → Emails → Templates → "Reset password".
     Subject: Reset your Character Forge password -->
<div style="margin:0;padding:32px 16px;background:#110e0c;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;">
  <div style="max-width:440px;margin:0 auto;background:#1c1815;border:1px solid #3b3027;border-radius:16px;padding:32px 28px;text-align:center;">
    <div style="font-family:Cinzel,Georgia,serif;font-size:22px;font-weight:700;color:#d4a64a;letter-spacing:0.04em;">CHARACTER FORGE</div>
    <h1 style="margin:20px 0 8px;font-family:Cinzel,Georgia,serif;font-size:22px;color:#ede4d4;">Choose a new password</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#a3927f;">Tap the button to pick a new password for your account.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 32px;border-radius:10px;background:#c0354a;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;">Reset password</a>
    <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#7d6f60;">Didn't ask for this? Ignore this email; your password stays the same.</p>
  </div>
</div>
